name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open FloatCue and ...
        2. ...
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone model and Android version
      placeholder: Pixel 8 Pro, Android 16
    validations:
      required: true
  - type: input
    id: camera
    attributes:
      label: Camera app
      placeholder: Pixel Camera
  - type: input
    id: version
    attributes:
      label: FloatCue version
      description: Shown in Settings → Apps → FloatCue.
      placeholder: 0.1.0
    validations:
      required: true
